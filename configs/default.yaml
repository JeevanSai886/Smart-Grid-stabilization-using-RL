# All electrical powers are MW; energy is MWh; time is seconds.
seed: 42
data:
  source: synthetic
  days: 30
  start: '2018-01-01'
  interval_seconds: 300
  train_fraction: 0.70
  validation_fraction: 0.15
environment:
  episode_steps: 900
  control_dt_s: 1.0
  history_length: 8
  mode: islanded
  load_scale: 0.80
  solar_capacity_mw: 1.40
  wind_capacity_mw: 1.00
  solar_buses: [13, 23, 29]
  wind_buses: [17, 26]
  battery_bus: 17
  slack_voltage_pu: 1.02
  line_rating_ka: 0.22
  voltage_min_pu: 0.95
  voltage_max_pu: 1.05
  frequency_limit_hz: 0.5
  blackout_frequency_hz: 2.5
  blackout_voltage_min_pu: 0.80
  blackout_voltage_max_pu: 1.20
  protection_delay_s: 2.0
  restart_delay_s: 10.0
  fast_fluctuation: 1.0
  source_event_probability: 0.6
  source_event_capacity_fraction: 0.60
battery:
  capacity_mwh: 0.25
  max_power_mw: 0.70
  soc_min: 0.20
  soc_max: 0.90
  initial_soc_min: 0.45
  initial_soc_max: 0.75
  charge_efficiency: 0.95
  discharge_efficiency: 0.95
frequency:
  nominal_hz: 50.0
  source_rating_mva: 4.0
  inertia_s: 4.0
  damping_mw_per_hz: 0.40
  governor_gain_mw_per_hz: 2.0
  governor_time_constant_s: 1.5
  source_max_mechanical_mw: 3.0
  source_max_electrical_mw: 4.5
  source_ramp_mw_per_s: 0.8
  integration_dt_s: 0.05
delay:
  mode: stochastic
  fixed_steps: 0
  max_steps: 5
  base_mean_steps: 0.7
  congestion_mean_steps: 3.0
  enter_congestion_probability: 0.03
  leave_congestion_probability: 0.15
  packet_loss_probability: 0.02
reward:
  stable: 1.0
  voltage: 8.0
  frequency: 4.0
  overload: 4.0
  shedding: 6.0
  blackout: 20.0
  battery: 0.02
  switching: 0.03
  clipped_action: 0.10
  curtailment: 0.50
training:
  total_timesteps: 200000
  n_steps: 1000
  batch_size: 100
  n_epochs: 10
  learning_rate: 0.0003
  gamma: 0.995
  gae_lambda: 0.95
  clip_range: 0.20
  ent_coef: 0.01
  net_arch: [64, 64]
  checkpoint_frequency: 5000
  evaluation_frequency: 5000
  evaluation_episodes: 2
  validation_seeds: [10042, 10043]
  torch_threads: 1
evaluation:
  episodes: 2
  episode_steps: 900
  delay_steps: [0, 1, 3, 5, 10]
  fluctuation_scales: [1.0]
  seeds: [101, 202]


logging:
  trace_stride: 10
